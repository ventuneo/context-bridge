name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please use **synthetic data** only: no real secrets, personal data,
        private paths or packs from private projects. Vulnerabilities go to SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python3 -I ~/.claude/skills/context-bridge/scripts/cb.py --version` (on Windows `python -I …`)
      placeholder: context-bridge 0.3.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and Claude Code version
      placeholder: Windows 11 (Git Bash), Python 3.13.2, Claude Code 2.1.319
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or request, the output and the exit code.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal synthetic project helps most, for example a copy of examples/demo-project.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, personal data and private project content from this report.
          required: true

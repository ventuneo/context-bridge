name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the privacy guard and the install smoke test read the history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -W error -m unittest discover -s tests -v
      - name: Context Quality Score gates
        run: python -I quality/run.py --check
      - name: Token estimate matches its measurements
        run: python -I quality/tokens/calibrate.py --check
      - name: Fresh install smoke test
        run: python -I tools/install_smoke.py --python python
      - name: JSON Schema cross-check (development dependency)
        run: |
          python -m pip install "jsonschema==4.23.0"
          python tools/check_schema.py
      - name: Privacy guard (tracked files and history)
        run: |
          python tools/privacy_check.py --all
          python tools/privacy_check.py --history

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.4"
      - run: ruff check .
      - run: ruff format --check .

[project]
name = "context-bridge"
version = "0.1.0.dev0"
description = "Extract, compress, verify and restore project context for AI sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["skills/context-bridge/scripts", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

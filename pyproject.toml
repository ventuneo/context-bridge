[project]
name = "context-bridge"
version = "0.3.0"
description = "Extract, compress, verify and restore project context for AI sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["skills/context-bridge/scripts", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["context_bridge"]
known-local-folder = ["helpers", "packtools"]
# helpers puts the package on sys.path, so it must be imported first.
section-order = ["future", "standard-library", "third-party", "local-folder", "first-party"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# Reason-code constants such as SECRET_FILE are not passwords.
"skills/context-bridge/scripts/context_bridge/policy.py" = ["S105"]
"skills/context-bridge/scripts/context_bridge/redact.py" = ["S105"]
